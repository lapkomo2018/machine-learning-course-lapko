[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lapko-wine-predictor"
version = "1.0.0"
description = "Frozen Wine Quality inference component for coursework"
requires-python = ">=3.12"
dependencies = ["scikit-learn==1.8.0","numpy==2.3.5","pandas==2.2.3","scipy==1.17.0","joblib==1.5.3","threadpoolctl==3.6.0"]

[project.scripts]
wine-predict = "ml_project.cli:main"

[tool.setuptools.package-data]
ml_project = ["assets/*"]
